<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PSYCHEDELIC COLLAPSE // VR</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; font-family:monospace; }
  #overlay {
    position:fixed; top:0; left:0; width:100%; z-index:10;
    color:#fff; text-align:center; padding:14px 0; pointer-events:none;
    text-shadow: 0 0 8px #f0f, 0 0 16px #0ff; letter-spacing: 4px; font-size: 14px;
  }
  #vrButtonContainer { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:20; }
  canvas { display:block; }
  #startScreen {
    position:fixed; inset:0; z-index:30; background:radial-gradient(circle at 50% 50%, #1a0033, #000 70%);
    display:flex; align-items:center; justify-content:center; flex-direction:column; color:#fff; cursor:pointer;
    text-align:center; padding: 0 20px;
  }
  #startScreen h1 { letter-spacing:6px; text-shadow:0 0 20px #f0f, 0 0 40px #0ff; font-size:22px; margin-bottom:6px; }
  #startScreen p { color:#c48fff; font-size:13px; letter-spacing:1.5px; max-width:480px; line-height:1.6; }
  #startScreen .warn { color:#ff8fae; font-size:11px; margin-top:18px; max-width:440px; }
  #hint {
    position:fixed; bottom:80px; width:100%; text-align:center; color:#aaa;
    font-size:12px; z-index:10; pointer-events:none;
  }
  #errorScreen {
    position:fixed; inset:0; z-index:50; background:#100; color:#ff6b6b;
    display:none; align-items:center; justify-content:center; flex-direction:column;
    font-family:monospace; text-align:left; padding:24px; box-sizing:border-box;
  }
  #errorScreen.show { display:flex; }
  #errorScreen h2 { color:#ff8fae; letter-spacing:2px; margin-bottom:12px; }
  #errorScreen pre {
    background:#1a0000; border:1px solid #ff6b6b33; padding:14px; border-radius:6px;
    max-width:700px; max-height:50vh; overflow:auto; white-space:pre-wrap; word-break:break-word;
    font-size:12px; line-height:1.5;
  }
  #errorScreen p.tip { color:#c48fff; max-width:700px; font-size:13px; line-height:1.6; }
</style>
</head>
<body>
<div id="startScreen">
  <h1>◈ PSYCHEDELIC COLLAPSE ◈</h1>
  <p>click / tap to enter &nbsp;·&nbsp; sound on</p>
  <p class="warn">Contains fast fine-line moiré patterns and flashing color. Take breaks if you feel discomfort;
  skip this if you have photosensitive epilepsy.</p>
</div>
<div id="overlay" style="display:none">◈ PSYCHEDELIC COLLAPSE ◈</div>
<div id="hint" style="display:none">move mouse to look &nbsp;·&nbsp; VR button appears below if headset detected</div>
<div id="vrButtonContainer"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { VRButton } from "three/addons/webxr/VRButton.js";

let scene, camera, rig, renderer, clock, uniforms;
let mouseX = 0, mouseY = 0;
let audioCtx, masterGain;

const startScreen = document.getElementById('startScreen');
let started = false;

startScreen.addEventListener('click', begin, { once:true });
startScreen.addEventListener('touchend', begin, { once:true, passive:true });

function begin(){
  if(started) return;
  started = true;

  startScreen.style.display = 'none';
  document.getElementById('overlay').style.display = 'block';
  document.getElementById('hint').style.display = 'block';

  initAudio();
  init3D();
}

/* ================= AUDIO: static + ringing ================= */
function makeNoiseBuffer(ctx, seconds){
  const len = Math.floor(ctx.sampleRate * seconds);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
  return buf;
}
function makeImpulse(ctx, seconds, decay){
  const len = Math.floor(ctx.sampleRate * seconds);
  const buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for(let ch=0; ch<2; ch++){
    const d = buf.getChannelData(ch);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, decay);
  }
  return buf;
}

function initAudio(){
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.55;

  const convolver = audioCtx.createConvolver();
  convolver.buffer = makeImpulse(audioCtx, 3.0, 1.8);
  const wetGain = audioCtx.createGain();
  wetGain.gain.value = 0.5;
  const dryGain = audioCtx.createGain();
  dryGain.gain.value = 0.8;
  masterGain.connect(dryGain).connect(audioCtx.destination);
  masterGain.connect(convolver).connect(wetGain).connect(audioCtx.destination);

  // --- STATIC: crackling filtered noise, like off-tune radio interference ---
  const noiseSrc = audioCtx.createBufferSource();
  noiseSrc.buffer = makeNoiseBuffer(audioCtx, 4);
  noiseSrc.loop = true;
  const bandpass = audioCtx.createBiquadFilter();
  bandpass.type = 'bandpass';
  bandpass.frequency.value = 1200;
  bandpass.Q.value = 3.5;
  const staticGain = audioCtx.createGain();
  staticGain.gain.value = 0.18;
  noiseSrc.connect(bandpass).connect(staticGain).connect(masterGain);
  noiseSrc.start();
  window.__bandpass = bandpass;
  window.__staticGain = staticGain;

  // random crackle bursts on top of the static bed
  function crackle(){
    const now = audioCtx.currentTime;
    const target = 0.08 + Math.random()*0.35;
    staticGain.gain.setTargetAtTime(target, now, 0.03);
    setTimeout(crackle, 60 + Math.random()*220);
  }
  crackle();

  // --- CONTINUOUS RINGING: high, thin, tinnitus-like tones that slowly drift ---
  const ringFreqs = [2800, 4200, 5600];
  window.__rings = ringFreqs.map((f, i) => {
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = f;
    const g = audioCtx.createGain();
    g.gain.value = 0.02 + i*0.005;
    const pan = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
    if(pan){ pan.pan.value = (i/ringFreqs.length)*2-1; osc.connect(g).connect(pan).connect(masterGain); }
    else { osc.connect(g).connect(masterGain); }
    osc.start();
    return { osc, base: f, g };
  });

  // --- STRUCK RINGING: periodic impulses through a high-Q resonant filter, like a struck bell/glass ---
  function strike(){
    const now = audioCtx.currentTime;
    const impulseSrc = audioCtx.createBufferSource();
    impulseSrc.buffer = makeNoiseBuffer(audioCtx, 0.03);
    const resonant = audioCtx.createBiquadFilter();
    resonant.type = 'bandpass';
    resonant.frequency.value = 400 + Math.random()*3200;
    resonant.Q.value = 35 + Math.random()*40;
    const g = audioCtx.createGain();
    g.gain.value = 0.0001;
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.5, now + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 1.8 + Math.random()*1.5);
    const pan = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
    impulseSrc.connect(resonant).connect(g);
    if(pan){ pan.pan.value = Math.random()*2-1; g.connect(pan).connect(masterGain); }
    else { g.connect(masterGain); }
    impulseSrc.start(now);
    setTimeout(strike, 700 + Math.random()*1800);
  }
  strike();
}

/* ================= 3D / SHADER DOME ================= */
function init3D(){
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(90, window.innerWidth/window.innerHeight, 0.05, 200);
  rig = new THREE.Group();
  rig.add(camera);
  scene.add(rig);

  // Keep the camera inside the headset-controlled XR rig.
  camera.position.set(0, 0, 0);

  renderer = new THREE.WebGLRenderer({
    antialias: false,
    powerPreference: "high-performance",
    alpha: false
  });

  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1));
  renderer.setSize(window.innerWidth, window.innerHeight);

  // WebXR
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType('local-floor');
  renderer.xr.addEventListener('sessionstart', () => {
    console.log('[XR] session started');
  });

  renderer.xr.addEventListener('sessionend', () => {
    console.log('[XR] session ended');
  });
  document.body.appendChild(renderer.domElement);
  const vrButton = VRButton.createButton(renderer);
  document.getElementById('vrButtonContainer').appendChild(vrButton);

  if (navigator.xr) {
    navigator.xr.isSessionSupported('immersive-vr')
      .then(supported => {
        console.log('[XR] immersive-vr supported:', supported);

        if (!supported) {
          console.warn('[XR] Immersive VR is not supported on this browser/device.');
        }
      })
      .catch(err => {
        console.warn('[XR] support check failed:', err);
      });
  } else {
    console.warn(
      '[XR] WebXR unavailable. Open this page through HTTPS or localhost ' +
      'and use a browser with WebXR support.'
    );
  }

  clock = new THREE.Clock();

  const geometry = new THREE.SphereGeometry(50, 64, 64);

  uniforms = {
    uTime:     { value: 0.0 },
    uCollapse: { value: 0.0 },
    uMouse:    { value: new THREE.Vector2(0,0) }
  };

  const material = new THREE.ShaderMaterial({
    uniforms: uniforms,
    side: THREE.BackSide,
    depthWrite: false,
    vertexShader: `
      varying vec3 vPos;
      void main(){
        vPos = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      precision mediump float;
      varying vec3 vPos;
      uniform float uTime;
      uniform float uCollapse;
      uniform vec2 uMouse;
      #define PI 3.14159265359

      mat2 rot(float a) {
        float s = sin(a), c = cos(a);
        return mat2(c,-s,s,c);
      }

      vec3 rainbow(float t) {
        return 0.5 + 0.5*cos(6.28318*(t + vec3(0.0,0.333,0.667)));
      }

      float hash21(vec2 p) {
        p = fract(p * vec2(123.34,456.21));
        p += dot(p,p + 45.32);
        return fract(p.x*p.y);
      }

      float field(vec2 p, out float hue) {
        float r = max(length(p),0.0001);
        float a = atan(p.y,p.x);

        float ac = a*14.0/(2.0*PI);
        float rc = log(r)*7.0/(2.0*PI)-uTime*(0.35+uCollapse*0.5);

        float af = abs(fract(ac)-0.5);
        float rf = abs(fract(rc)-0.5);
        float d = length(vec2(af,rf*1.3));

        float ring = 1.0-smoothstep(0.08,0.48,d);
        float edge = 1.0-smoothstep(0.01,0.08,abs(d-0.18));

        float seed = hash21(vec2(floor(ac),floor(rc)));
        hue = fract(seed+rc*0.035-uTime*0.04);

        float x = a*150.0+seed*25.0+uTime*2.5;
        float fine = pow(abs(sin(x)),12.0);
        float y = a*70.0-r*18.0+uTime;
        float moire = fine*(0.25+0.75*sin(y)*sin(y));

        return ring*1.15+edge*0.9+moire*0.45;
      }

      void main() {
        vec3 dir = normalize(vPos);
        dir.xy = rot(uMouse.x*0.45)*dir.xy;
        dir.yz = rot(uMouse.y*0.30)*dir.yz;

        float theta = atan(dir.z,dir.x);
        float phi = asin(clamp(dir.y,-1.0,1.0));
        vec2 p = vec2(theta,phi*2.2)*(2.4+uCollapse*0.45);

        float h1,h2,h3;
        float v1 = field(p,h1);
        float v2 = field(p*1.025+vec2(0.02,-0.01),h2);
        float v3 = field(p*0.975+vec2(-0.02,0.01),h3);

        vec3 col = vec3(v1,v2,v3)*0.48;
        col += rainbow(h1)*v1*0.75;

        vec3 forward = vec3(0.0,0.0,-1.0);
        float centerAngle = acos(clamp(dot(dir,forward),-1.0,1.0));
        float jag = sin(theta*34.0+uTime*1.7)*0.5+0.5;
        float radius = 0.24+jag*0.055+sin(uCollapse*2.0)*0.025;

        float core = 1.0-smoothstep(radius-0.055,radius,centerAngle);
        float rim = 1.0-smoothstep(0.0,0.035,abs(centerAngle-radius));

        col *= 1.0-core*0.94;
        col += vec3(rim)*1.25;
        col *= 0.92+0.22*sin(uTime*2.2+v1*7.0);
        col = max(col,vec3(0.015));

        gl_FragColor = vec4(col,1.0);
      }
    `
  });

  const mesh = new THREE.Mesh(geometry, material);
  scene.add(mesh);

  // Catch shader compilation/link errors, especially useful on Quest/WebXR.
  renderer.debug.checkShaderErrors = true;
  material.onBeforeCompile = (shader) => {
    console.log('[Shader] compiling psychedelic VR shader');
  };

  window.addEventListener('resize', onResize);
  window.addEventListener('mousemove', onMouseMove);
  window.addEventListener('touchmove', onTouchMove, {passive:true});

  renderer.setAnimationLoop(animate);
}

function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
function onMouseMove(e){
  mouseX = (e.clientX / window.innerWidth - 0.5) * 2.0;
  mouseY = (e.clientY / window.innerHeight - 0.5) * 2.0;
}
function onTouchMove(e){
  if(e.touches.length>0){
    mouseX = (e.touches[0].clientX / window.innerWidth - 0.5) * 2.0;
    mouseY = (e.touches[0].clientY / window.innerHeight - 0.5) * 2.0;
  }
}

function animate(){
  const t = clock.getElapsedTime();
  uniforms.uTime.value = t;
  uniforms.uCollapse.value = (Math.sin(t*0.08)*0.5+0.5)*1.4 + Math.sin(t*0.02)*0.3;

  if(!renderer.xr.isPresenting){
    uniforms.uMouse.value.x += (mouseX - uniforms.uMouse.value.x) * 0.05;
    uniforms.uMouse.value.y += (mouseY - uniforms.uMouse.value.y) * 0.05;
  }

  if(window.__bandpass){
    window.__bandpass.frequency.setTargetAtTime(600 + Math.sin(t*0.15)*500 + 500, audioCtx.currentTime, 0.15);
  }
  if(window.__rings){
    window.__rings.forEach((rgn, i) => {
      rgn.osc.frequency.setTargetAtTime(rgn.base * (1 + Math.sin(t*0.05 + i*2.0)*0.006), audioCtx.currentTime, 0.4);
    });
  }

  renderer.render(scene, camera);
}
</script>
</body>
</html>
